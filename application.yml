general:
    kafka-topic: general.kafka-topic

spring:
    kafka:
        bootstrap-servers: localhost:9092  # Ensure this points to your Kafka broker

        producer:
            key-serializer: org.apache.kafka.common.serialization.IntegerSerializer
            value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

        consumer:
            group-id: midas-core-group
            key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
            value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
            properties:
                spring.json.trusted.packages: "*"  # Allow deserialization of Transaction objects
                spring:
                    datasource:
                        url: jdbc:h2:mem:testdb  # In-memory database
                        driver-class-name: org.h2.Driver
                        username: sa
                        password:
                    h2:
                        console:
                            enabled: true  # Allows you to see the database in a browser
                    jpa:
                        database-platform: org.hibernate.dialect.H2Dialect
                        hibernate:
                            ddl-auto: update  # Auto-create tables
                        show-sql: true  # Print SQL in the logs

